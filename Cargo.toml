[package]
name = "remote-zip-peek"
version = "0.1.0"
edition = "2021"
description = "A CLI tool to list files in a remote ZIP archive without downloading the entire file."
keywords = ["zip", "cli", "http-range", "remote-file", "partial-download"]
license = "GPL-3.0"

[dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
zip = "0.6"
indicatif = "0.17"


name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS (Apple Silicon), macOS (Intel), Linux]
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Archive URL or host
      description: Leave out anything private, such as a signed link. The host alone is still useful.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error message.
    validations:
      required: true
  - type: textarea
    id: range-check
    attributes:
      label: Range support check
      description: "The output of `curl -sI -H 'Range: bytes=0-99' '<url>' | head -n 1`"

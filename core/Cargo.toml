[package]
name = "lazy-zip-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false }
async_zip = { version = "0.0.18", features = ["tokio", "deflate", "deflate64", "bzip2", "zstd", "lzma", "xz"] }
# Linked statically so the app doesn't depend on a liblzma installed on the build machine.
liblzma = { version = "0.4", features = ["static"] }
tokio-util = { version = "0.7", features = ["compat", "io", "rt"] }
futures = "0.3"
tokio = { version = "1", features = ["io-util", "fs", "macros", "time"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
bytes = "1.0"
async-stream = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tempfile = "3"
crc32fast = "1"
flate2 = "1"

[features]
default = ["rustls"]
rustls = ["reqwest/rustls"]

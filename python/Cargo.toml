[package]
name = "lazy-zip-py"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lazy_zip"
crate-type = ["cdylib"]

[dependencies]
lazy-zip-core = { path = "../core" }
pyo3 = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
tokio-stream = "0.1"
bytes = "1.0"

[build-dependencies]
pyo3-build-config = "0.29"

[package]
name = "lazy-zip-cli"
version = "0.1.1"
edition = "2021"

[dependencies]
lazy-zip-core = { path = "../core" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
indicatif = "0.17"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
ratatui = "0.26"
crossterm = "0.27"
bytes = "1.0"
log = "0.4"
env_logger = "0.11"
